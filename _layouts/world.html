---
layout: default
---

<h1>{{ page.title }}</h1>

<p><strong>{{ page.worldname }}</strong></p>

<details open="">
    <summary>목차</summary>
    <ul>
        <li><a href="#world-info">소개</a></li>
        {% assign chunks = content | split: '<h2' %}
        {% for chunk in chunks offset:1 %}
            {% assign id = chunk | split: 'id="' | last | split: '"' | first %}
            {% assign label = chunk | split: '>' | slice: 1 | first | split: '</h2' | first %}
            <li><a href="#{{ id }}">{{ label }}</a></li>
        {% endfor %}
    </ul>
</details>

<h2 id="world-info">소개</h2>

<img src="/universe/assets/img/views/{{ page.worldname | downcase }}.png" alt="{{ page.title }} 배경 이미지" style="width: 100%;">

{{ content }}
